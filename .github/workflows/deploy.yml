name: Deploy ElViolevador Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "bot/,Dockerfile,docker-compose.yml"
          target: "/home/${{ secrets.SERVER_USER }}/elviolevador_bot"
          rm: true

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/elviolevador_bot
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" > .env
            echo "ALLOWED_USERS=${{ secrets.ALLOWED_USERS }}" >> .env
            echo "DOWNLOAD_DIR=/downloads" >> .env
            echo "MAX_FILE_BYTES=52428800" >> .env
            echo "RATE_LIMIT_CALLS=3" >> .env
            echo "RATE_LIMIT_PERIOD=60" >> .env
            sudo docker compose up -d --build
